name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      module:
        description: Which module to test
        type: choice
        default: all
        options: [all, selenium-testng, playwright-java, restassured-api, cucumber-bdd]
  schedule:
    - cron: "30 20 * * *"   # nightly, 20:30 UTC = 02:00 IST

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # all four modules, or only the one picked in "Run workflow"
        module: ${{ fromJSON((inputs.module && inputs.module != 'all') && format('["{0}"]', inputs.module) || '["selenium-testng","playwright-java","restassured-api","cucumber-bdd"]') }}
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install Playwright browsers
        if: matrix.module == 'playwright-java'
        run: mvn -B -ntp exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install --with-deps chromium"

      - name: Run tests
        run: mvn -B -ntp test -Dheadless=true
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"   # Chromium was installed above; do not fetch all browsers again

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-${{ matrix.module }}
          path: ${{ matrix.module }}/target/allure-results
          if-no-files-found: warn
          retention-days: 14

  report:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all Allure results
        uses: actions/download-artifact@v8
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/configure-pages@v6
        id: pages
        if: github.event_name != 'pull_request'

      - name: Keep the trend history of the last published report
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          mkdir -p allure-results/history
          for f in history.json history-trend.json duration-trend.json categories-trend.json retry-trend.json; do
            curl -sfL "${{ steps.pages.outputs.base_url }}/history/$f" -o "allure-results/history/$f" || true
          done

      - name: Add CI info to the report
        run: |
          cat > allure-results/executor.json <<EOF
          {"name": "GitHub Actions", "type": "github", "buildName": "${{ github.workflow }} #${{ github.run_number }}",
           "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}
          EOF

      - name: Build ONE combined Allure report (Allure 2.46.2)
        run: npx --yes allure-commandline@2.46.2 generate allure-results --clean -o allure-report

      - name: Upload the report for GitHub Pages
        uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: allure-report

      - name: Upload the report as a zip (pull requests)
        uses: actions/upload-artifact@v7
        if: github.event_name == 'pull_request'
        with:
          name: allure-report
          path: allure-report

  deploy:
    needs: report
    if: always() && needs.report.result == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
